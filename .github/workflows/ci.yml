name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read
  pull-requests: read

jobs:
  ci:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
      - name: Install root dependencies
        run: npm ci
      - name: Install dashboard dependencies
        run: npm --prefix dashboard ci
      - name: Design guardrail
        run: npm run validate:design
      - name: Run tests
        run: npm test
      - name: Validate copy registry
        run: npm run validate:copy
      - name: Validate UI hardcode guardrails
        run: npm run validate:ui-hardcode
      - name: Validate guardrails
        run: npm run validate:guardrails
      - name: Validate PR risk layer
        if: github.event_name == 'pull_request'
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: npm run validate:pr-risk-layer
      - name: Guardrail tests
        run: node --test test/architecture-guardrails.test.js
      - name: Check InsForge build outputs
        run: npm run build:insforge:check
      - name: Build dashboard
        run: npm --prefix dashboard run build
      - name: Install Chromium for the layout audits
        run: npm --prefix dashboard exec -- playwright install --with-deps chromium
      - name: Layout audits (small type, edge lines)
        run: npm --prefix dashboard run audit:ui
