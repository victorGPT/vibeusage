<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Activity</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600&amp;display=swap">
<style>body{margin:0}</style>
</helmet>
<section aria-label="Activity, 52 weeks" style="box-sizing: border-box; width: 100%; min-height: {{minH}}; display: flex; flex-direction: column; gap: 12px; background: #061716; border: 1px solid #1f4e48; border-radius: 8px; padding: 24px; color: #bfe9e1; font-family: Barlow, sans-serif">
  <dc-import name="Label" text="Activity · 52 weeks" hint-size="140px,11px"></dc-import>
  <div style="overflow-x: auto">
    <div style="min-width: 480px; display: flex; flex-direction: column; gap: 8px">
      <div style="display: grid; grid-template-columns: repeat(12, minmax(0, 1fr))">
        <sc-for list="{{months}}" as="m" hint-placeholder-count="12"><dc-import name="Label" text="{{m}}" hint-size="24px,11px"></dc-import></sc-for>
      </div>
      <div role="img" aria-label="Daily tokens over 52 weeks. Larger dot means more tokens." style="display: grid; grid-template-columns: repeat(52, minmax(0, 1fr)); grid-template-rows: repeat(7, 12px); grid-auto-flow: column; gap: 2px">
        <sc-for list="{{days}}" as="d" hint-placeholder-count="364"><i style="{{d.style}}"></i></sc-for>
      </div>
    </div>
  </div>
  <div style="display: flex; justify-content: space-between; align-items: center; gap: 12px">
    <dc-import name="Label" text="Dot size = tokens that day" hint-size="180px,11px"></dc-import>
    <span aria-hidden="true" style="display: inline-flex; align-items: center; gap: 8px">
      <i style="width: 2px; height: 2px; border-radius: 50%; background: #2c6b63"></i>
      <i style="width: 4px; height: 4px; border-radius: 50%; background: #e0b04a"></i>
      <i style="width: 6px; height: 6px; border-radius: 50%; background: #e0b04a"></i>
      <i style="width: 9px; height: 9px; border-radius: 50%; background: #e0b04a"></i>
    </span>
  </div>
  <div style="margin-top: auto">
    <dc-import name="Stamp" handle="your_handle" range="2025-11-13 → 2026-11-12" hint-size="100%,22px"></dc-import>
  </div>
</section>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"minH":{"editor":"text","default":"auto"},"$preview":{"width":600,"height":264}}'>
class Component extends DCLogic {
  renderVals() {
    let seed = 2049;
    const rnd = () => { seed = (seed * 16807) % 2147483647; return seed / 2147483647; };
    const days = [];
    for (let i = 0; i < 364; i++) {
      const week = Math.floor(i / 7), dow = i % 7, weekend = dow === 0 || dow === 6;
      const r = rnd(), trend = 0.35 + 0.65 * (week / 52);
      const off = r < (weekend ? 0.45 : 0.08);
      const lvl = off ? 0 : Math.min(4, 1 + Math.floor(rnd() * trend * 4.2));
      const size = [2, 3, 5, 7, 9][lvl];
      days.push({ style: 'display: block; justify-self: center; align-self: center; width: ' + size + 'px; height: ' + size + 'px; border-radius: 50%; background: ' + (lvl ? '#e0b04a' : '#2c6b63') });
    }
    return { minH: this.props.minH ?? 'auto', days, months: ['Nov', 'Dec', 'Jan', 'Feb', 'Mar', 'Apr', 'May', 'Jun', 'Jul', 'Aug', 'Sep', 'Oct'] };
  }
}
</script>
</body>
</html>
