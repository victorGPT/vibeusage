<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>My rank</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600&amp;family=Saira:wght@200;300;400&amp;display=swap">
<style>body{margin:0}</style>
</helmet>
<section aria-label="My rank" style="position: relative; box-sizing: border-box; width: 100%; min-height: {{minH}}; display: flex; flex-direction: column; overflow: hidden; border-radius: 18px; border: 1px solid #2c6b63; background: radial-gradient(130% 100% at 50% 40%, #0c2c29 0%, #061716 65%, #020807 100%); box-shadow: inset 0 0 40px rgba(127, 217, 203, 0.1); padding: 24px; color: #bfe9e1; font-family: Barlow, sans-serif">
  <dc-import name="ScreenFx" embedded="{{yes}}" hint-size="0px,0px"></dc-import>
  <div style="position: relative; display: flex; flex-direction: column; gap: 16px; flex: 1 1 auto">
    <dc-import name="Label" text="My rank · week · all models" hint-size="200px,11px"></dc-import>
    <div style="display: flex; flex-wrap: wrap; align-items: flex-end; gap: 16px 32px">
      <div style="display: flex; align-items: baseline; gap: 12px">
        <dc-import name="Display" text="#7" size="88" tone="amber" hint-size="100px,88px"></dc-import>
        <dc-import name="Delta" value="{{delta}}" hint-size="32px,11px"></dc-import>
      </div>
      <div style="display: flex; flex-direction: column; gap: 8px; padding-bottom: 8px">
        <dc-import name="Heading" text="your_handle" size="xs" level="2" hint-size="140px,26px"></dc-import>
        <dc-import name="Label" text="of 137 ranked" hint-size="100px,11px"></dc-import>
      </div>
      <div style="margin-left: auto; display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); column-gap: 16px">
        <dc-import name="Stat" label="Tokens" value="195.9M" hint-size="120px,47px"></dc-import>
        <dc-import name="Stat" label="To pass #6" value="+38.7M" divider="{{yes}}" hint-size="120px,47px"></dc-import>
      </div>
    </div>
    <div style="display: flex; flex-direction: column; border-top: 1px solid #1f4e48">
      <sc-for list="{{rows}}" as="r" hint-placeholder-count="7">
        <dc-import name="RankRow" rank="{{r.rank}}" user="{{r.user}}" value="{{r.v}}" me="{{r.me}}" hint-size="100%,40px"></dc-import>
      </sc-for>
    </div>
    <div style="margin-top: auto">
      <dc-import name="Stamp" handle="your_handle" range="Week · 2026-11-06 → 11-12" hint-size="100%,22px"></dc-import>
    </div>
  </div>
</section>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"minH":{"editor":"text","default":"auto"},"$preview":{"width":760,"height":544}}'>
class Component extends DCLogic {
  renderVals() {
    // 上下各 3 名邻居，正好填满与 RankList 同高的一行
    const rows = [['#4', 'tabs_not_spaces', '318.2M'], ['#5', 'segfault_sam', '276.4M'], ['#6', 'heap_of_trouble', '234.6M'], ['#7', 'your_handle · you', '195.9M'], ['#8', 'dev_null_dan', '188.0M'], ['#9', '0xdeadbeef', '171.3M'], ['#10', 'rubber_duck', '150.8M']]
      .map(([rank, user, v]) => ({ rank, user, v, me: rank === '#7' }));
    return { rows, yes: true, delta: -2, minH: this.props.minH ?? 'auto' };
  }
}
</script>
</body>
</html>
