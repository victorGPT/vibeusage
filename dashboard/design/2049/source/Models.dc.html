<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Models</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600&amp;family=Saira:wght@200;300;400&amp;display=swap">
<style>body{margin:0}</style>
</helmet>
<section aria-label="Models" style="box-sizing: border-box; width: 100%; min-height: {{minH}}; display: flex; flex-direction: column; gap: 4px; background: #061716; border: 1px solid #1f4e48; border-radius: 8px; padding: 24px; color: #bfe9e1; font-family: Barlow, sans-serif">
  <div style="display: flex; align-items: center; gap: 12px; padding-bottom: 8px">
    <dc-import name="Label" text="Models · total" hint-size="100px,11px"></dc-import>
    <div style="margin-left: auto">
      <dc-import name="ToggleGroup" items="{{groups}}" value="{{by}}" on-value-change="{{setBy}}" aria-label="Group by" hint-size="150px,17px"></dc-import>
    </div>
  </div>
  <sc-for list="{{rows}}" as="r" hint-placeholder-count="7">
    <dc-import name="ShareRow" label="{{r.name}}" value="{{r.v}}" pct-text="{{r.p}}" bar="{{r.bar}}" sub="{{r.sub}}" hint-size="100%,80px"></dc-import>
  </sc-for>
  <div style="margin-top: auto; padding-top: 8px">
    <dc-import name="Stamp" handle="your_handle" range="Total · 2025-11-13 → 2026-11-12" hint-size="100%,22px"></dc-import>
  </div>
</section>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"minH":{"editor":"text","default":"auto"},"$preview":{"width":660,"height":720}}'>
class Component extends DCLogic {
  renderVals() {
    const TOTAL = 4733386712;
    const CLIS = [
      ['Codex', 58, [['gpt-5.2-codex', 64], ['gpt-5.2', 18], ['gpt-5.1-codex-max', 18]]],
      ['Claude Code', 21, [['claude-opus-4.5', 70], ['claude-sonnet-4.5', 22], ['claude-haiku-4.5', 8]]],
      ['Gemini', 9, [['gemini-3-pro', 80], ['gemini-2.5-flash', 20]]],
      ['OpenCode', 5, [['claude-sonnet-4.5', 55], ['gpt-5.2', 30], ['kimi-k2', 15]]],
      ['Kimi', 3, [['kimi-k2', 100]]],
      ['Hermes', 2, [['hermes-4', 70], ['gpt-5.2', 30]]],
      ['OpenClaw', 2, [['claude-opus-4.5', 60], ['gpt-5.2-codex', 40]]]
    ];
    const abbr = (n) => n >= 1e9 ? (n / 1e9).toFixed(2) + 'B' : (n / 1e6).toFixed(1) + 'M';
    const by = this.state?.by ?? 'cli';
    let rows;
    if (by === 'cli') {
      rows = CLIS.map(([name, pct, ms]) => ({ name, v: abbr(TOTAL * pct / 100), p: pct.toFixed(1) + '%', bar: pct / 58 * 100, sub: ms.map(([m, s]) => m + ' ' + s + '%').join('   ') }));
    } else {
      const agg = {};
      CLIS.forEach(([cli, pct, ms]) => ms.forEach(([m, s]) => {
        agg[m] = agg[m] || { v: 0, via: [] };
        agg[m].v += pct * s / 100; agg[m].via.push(cli);
      }));
      const list = Object.entries(agg).sort((a, b) => b[1].v - a[1].v);
      const max = list[0][1].v;
      rows = list.map(([m, o]) => ({ name: m, v: abbr(TOTAL * o.v / 100), p: o.v.toFixed(1) + '%', bar: o.v / max * 100, sub: 'via ' + o.via.join(', ') }));
    }
    return {
      rows, by, setBy: (k) => this.setState({ by: k }),
      groups: [{ key: 'cli', label: 'By CLI' }, { key: 'model', label: 'By model' }],
      minH: this.props.minH ?? 'auto'
    };
  }
}
</script>
</body>
</html>
