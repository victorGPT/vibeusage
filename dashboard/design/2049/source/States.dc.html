<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>States</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600&amp;family=Saira:wght@200;300;400&amp;family=JetBrains+Mono:wght@500&amp;display=swap">
<style>body{margin:0;background:#03100f}</style>
</helmet>
<div style="box-sizing: border-box; width: 100%; min-height: 100vh; background: #03100f; padding: 0 32px 48px; font-family: Barlow, sans-serif; color: #bfe9e1">
  <div style="max-width: 1216px; margin: 0 auto; display: flex; flex-direction: column; gap: 24px">
    <dc-import name="TopNav" active="dashboard" signed-in="{{yes}}" hint-size="100%,80px"></dc-import>
    <dc-import name="PageHeader" title="States" meta="Each state replaces the main screen only. The rest of the page keeps its layout." hint-size="100%,96px"></dc-import>
    <div style="display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 480px), 1fr)); gap: 40px 16px">
      <sc-for list="{{states}}" as="s" hint-placeholder-count="7">
        <div style="display: flex; flex-direction: column; gap: 8px; min-width: 0">
          <dc-import name="Label" text="{{s.label}}" hint-size="200px,11px"></dc-import>
          <dc-import name="StateScreen" variant="{{s.v}}" hint-size="100%,264px"></dc-import>
        </div>
      </sc-for>
    </div>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1280,"height":1240}}'>
class Component extends DCLogic {
  renderVals() {
    const states = [
      ['install', 'Not signed in or not installed'], ['expired', 'Session expired'], ['visitor', 'Viewing someone else'],
      ['invalid', 'Share link broken'], ['empty', 'Installed, no data yet'], ['loading', 'Loading'], ['error', 'Service error']
    ].map(([v, label]) => ({ v, label }));
    return { yes: true, states };
  }
}
</script>
</body>
</html>
