<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Landing hero</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600&amp;family=Saira:wght@200;300;400&amp;family=JetBrains+Mono:wght@500&amp;display=swap">
<style>body{margin:0}</style>
</helmet>
<div style="box-sizing: border-box; width: 100%; display: flex; flex-direction: column; gap: 24px; padding: 8px 0; background: #03100f; color: #bfe9e1; font-family: Barlow, sans-serif">
  <div role="list" aria-label="Supported CLIs" style="display: flex; flex-wrap: wrap; gap: 8px">
    <sc-for list="{{clis}}" as="c" hint-placeholder-count="7">
      <span role="listitem"><dc-import name="Badge" text="{{c}}" variant="outline" hint-size="80px,20px"></dc-import></span>
    </sc-for>
  </div>
  <div style="display: flex; flex-direction: column">
    <dc-import name="Heading" text="More tokens." size="xl" upper="{{yes}}" level="1" hint-size="100%,72px"></dc-import>
    <dc-import name="Heading" text="More vibe." size="xl" tone="amber" upper="{{yes}}" level="1" hint-size="100%,72px"></dc-import>
  </div>
  <dc-import name="Text" text="One readout for every AI coding CLI you run, and a board that shows where you stand. Token counts only. Your prompts and code never leave your machine." size="l" max-ch="{{46}}" hint-size="100%,77px"></dc-import>
  <div style="display: flex; flex-direction: column; gap: 24px">
    <dc-import name="CommandBox" cmd="npx --yes vibeusage init" hint-size="100%,48px"></dc-import>
    <!-- 标签跟它说明的那条命令靠在一起：组内 8，组间 24 -->
    <div style="display: flex; flex-direction: column; gap: 8px">
      <dc-import name="Label" text="Or hand this guide to your agent" hint-size="240px,11px"></dc-import>
      <dc-import name="CommandBox" cmd="vibeusage.cc/agent-install" prefix="↳" copy-label="Copy link" hint-size="100%,48px"></dc-import>
    </div>
  </div>
  <div><dc-import name="Button" label="Sign in with GitHub" variant="default" size="lg" href="#" hint-size="200px,48px"></dc-import></div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":620,"height":580}}'>
class Component extends DCLogic {
  renderVals() {
    return { yes: true, clis: ['Codex', 'Claude Code', 'Gemini', 'OpenCode', 'Kimi', 'Hermes', 'OpenClaw'] };
  }
}
</script>
</body>
</html>
