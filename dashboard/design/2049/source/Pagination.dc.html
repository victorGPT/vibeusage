<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Pagination</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600&amp;display=swap">
<style>body{margin:0}</style>
</helmet>
<nav aria-label="Pagination" style="box-sizing: border-box; width: 100%; display: flex; flex-wrap: wrap; align-items: center; gap: 8px; background: {{bg}}; padding: {{pad}}; font-family: Barlow, sans-serif; color: #6fa79e">
  <dc-import name="Label" text="{{summary}}" hint-size="100px,11px"></dc-import>
  <div style="margin-left: auto; display: flex; flex-wrap: wrap; gap: 4px">
    <sc-for list="{{items}}" as="p" hint-placeholder-count="7">
      <dc-import name="Button" label="{{p.label}}" variant="{{p.variant}}" disabled="{{p.disabled}}" on-click="{{p.go}}" hint-size="40px,32px"></dc-import>
    </sc-for>
  </div>
</nav>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"page":{"editor":"int","default":1},"total":{"editor":"int","default":7},"summary":{"editor":"text","default":""},"onPageChange":{"editor":null},"$preview":{"width":480,"height":56}}'>
class Component extends DCLogic {
  renderVals() {
    const solo = Object.keys(this.props).filter((k) => k[0] !== '$' && k !== 'children').length === 0;
    const total = Math.max(1, Number(this.props.total ?? 7));
    const page = Math.min(total, Math.max(1, Number(this.props.page ?? this.state?.p ?? 1)));
    const go = (n) => () => {
      if (this.props.page === undefined) this.setState({ p: n });
      if (this.props.onPageChange) this.props.onPageChange(n);
    };
    // ponytail: first, current±1, last, with one ellipsis gap marker each side; enough for ≤ a few hundred pages
    const nums = [...new Set([1, page - 1, page, page + 1, total])].filter((n) => n >= 1 && n <= total).sort((a, b) => a - b);
    const items = [{ label: 'Prev', variant: 'outline', disabled: page === 1, go: go(page - 1) }];
    nums.forEach((n, i) => {
      if (i && n - nums[i - 1] > 1) items.push({ label: '…', variant: 'ghost', disabled: true, go: () => {} });
      items.push({ label: String(n), variant: n === page ? 'default' : 'outline', disabled: false, go: go(n) });
    });
    items.push({ label: 'Next', variant: 'outline', disabled: page === total, go: go(page + 1) });
    return {
      items, summary: this.props.summary || ('Page ' + page + ' of ' + total),
      bg: solo ? '#03100f' : 'transparent', pad: solo ? '12px' : '0'
    };
  }
}
</script>
</body>
</html>
