<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Rank rail</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600&amp;family=Saira:wght@200;300;400&amp;display=swap">
<style>body{margin:0}</style>
</helmet>
<section aria-label="Week rank" style="box-sizing: border-box; width: 100%; min-height: {{minH}}; display: flex; flex-direction: column; gap: 16px; background: #061716; border: 1px solid #1f4e48; border-radius: 8px; padding: 24px; color: #bfe9e1; font-family: Barlow, sans-serif">
  <div style="display: flex; align-items: center; gap: 12px">
    <dc-import name="Label" text="Week rank" hint-size="80px,11px"></dc-import>
    <div style="margin-left: auto"><dc-import name="Button" label="Leaderboard" variant="outline" href="Leaderboard.dc.html" hint-size="120px,32px"></dc-import></div>
  </div>
  <div style="display: flex; align-items: baseline; gap: 12px">
    <dc-import name="Display" text="#7" size="72" tone="amber" glow="{{no}}" hint-size="80px,72px"></dc-import>
    <dc-import name="Delta" value="{{delta}}" suffix="vs last week" hint-size="120px,11px"></dc-import>
  </div>
  <div style="border-top: 1px solid #1f4e48; padding-top: 16px">
    <dc-import name="Stat" label="To pass #6 · heap_of_trouble" value="+38.7M" hint-size="100%,47px"></dc-import>
  </div>
  <div style="border-top: 1px solid #1f4e48; padding-top: 16px">
    <dc-import name="Stat" label="This week" value="195.9M · 137 ranked" size="S" hint-size="100%,37px"></dc-import>
  </div>
  <div style="margin-top: auto">
    <dc-import name="Stamp" handle="your_handle" range="11-06 → 11-12" hint-size="100%,22px"></dc-import>
  </div>
</section>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"minH":{"editor":"text","default":"auto"},"$preview":{"width":420,"height":384}}'>
class Component extends DCLogic {
  renderVals() { return { minH: this.props.minH ?? 'auto', no: false, delta: -2 }; }
}
</script>
</body>
</html>
