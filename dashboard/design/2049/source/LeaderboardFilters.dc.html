<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Leaderboard filters</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600&amp;display=swap">
<style>body{margin:0}</style>
</helmet>
<div style="box-sizing: border-box; display: flex; flex-wrap: wrap; align-items: center; gap: 16px 32px; padding: 16px 0; background: #03100f; color: #6fa79e; font-family: Barlow, sans-serif">
  <dc-import name="ToggleGroup" items="{{periods}}" value="{{period}}" on-value-change="{{setPeriod}}" aria-label="Period" hint-size="180px,17px"></dc-import>
  <div style="border-left: 1px solid #1f4e48; padding-left: 32px">
    <dc-import name="ToggleGroup" items="{{metrics}}" value="{{metric}}" on-value-change="{{setMetric}}" aria-label="Metric" hint-size="160px,17px"></dc-import>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":560,"height":48}}'>
class Component extends DCLogic {
  renderVals() {
    return {
      periods: [{ key: 'week', label: 'Week' }, { key: 'month', label: 'Month' }, { key: 'total', label: 'Total' }],
      metrics: [{ key: 'all', label: 'All' }, { key: 'gpt', label: 'GPT' }, { key: 'claude', label: 'Claude' }],
      period: this.state?.period ?? 'week', metric: this.state?.metric ?? 'all',
      setPeriod: (k) => this.setState({ period: k }), setMetric: (k) => this.setState({ metric: k })
    };
  }
}
</script>
</body>
</html>
