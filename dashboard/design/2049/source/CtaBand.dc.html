<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Call to action</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600&amp;family=Saira:wght@200;300;400&amp;display=swap">
<style>body{margin:0}</style>
</helmet>
<section style="box-sizing: border-box; width: 100%; display: flex; flex-direction: column; align-items: center; gap: 16px; padding: 24px 0; text-align: center; background: {{bg}}; font-family: Barlow, sans-serif; color: #e2f8f3">
  <dc-import name="Heading" text="{{title}}" size="m" level="2" hint-size="560px,44px"></dc-import>
  <dc-import name="Button" label="{{buttonLabel}}" variant="default" size="lg" href="{{href}}" hint-size="220px,44px"></dc-import>
  <sc-if value="{{hasMeta}}" hint-placeholder-val="{{true}}"><dc-import name="Label" text="{{meta}}" hint-size="160px,11px"></dc-import></sc-if>
</section>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"title":{"editor":"text","default":"See where you rank this week."},"buttonLabel":{"editor":"text","default":"Sign in with GitHub"},"href":{"editor":"text","default":"#"},"meta":{"editor":"text","default":"v0.7.1 · open source"},"$preview":{"width":1216,"height":200}}'>
class Component extends DCLogic {
  renderVals() {
    const solo = Object.keys(this.props).filter((k) => k[0] !== '$' && k !== 'children').length === 0;
    const meta = this.props.meta ?? (solo ? 'v0.7.1 · open source' : '');
    return {
      title: this.props.title ?? 'See where you rank this week.', buttonLabel: this.props.buttonLabel ?? 'Sign in with GitHub',
      href: this.props.href ?? '#', meta, hasMeta: !!meta, bg: solo ? '#03100f' : 'transparent'
    };
  }
}
</script>
</body>
</html>
